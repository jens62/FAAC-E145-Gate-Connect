<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAAC Gate Animation - 2D View v13</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #e0e0e0;
        }

        .container {
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 1400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .wing-control {
            background: rgba(40, 40, 40, 0.8);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .wing-control h3 {
            margin-bottom: 15px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wing-label {
            font-size: 1.1em;
        }

        .wing-position {
            font-size: 1.3em;
            font-weight: 700;
            color: #4caf50;
            font-family: 'Courier New', monospace;
        }

        .slider-container {
            margin-bottom: 15px;
        }

        .slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #4caf50;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(76, 175, 80, 0.5);
        }

        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #4caf50;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 10px rgba(76, 175, 80, 0.5);
        }

        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-group input[type="number"] {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1em;
            font-family: 'Courier New', monospace;
        }

        .input-group button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: #4caf50;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .input-group button:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 15px;
        }

        .quick-btn {
            padding: 8px;
            border-radius: 6px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .gate-viewport {
            width: 100%;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to bottom, #d4e6f1 0%, #e8f4f8 50%, #d0d8dc 100%);
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
            padding: 40px 20px;
            overflow: hidden;
        }

        .gate-wrapper {
            width: 100%;
            max-width: 1100px;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box {
            background: rgba(40, 40, 40, 0.8);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-label {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.3em;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            color: #4caf50;
        }

        @media (max-width: 768px) {
            .controls-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FAAC Gate - 2D Animation v13</h1>
        <div class="subtitle">Corrected: equal bar spacing, right frame edge at 1725mm</div>

        <div class="controls-grid">
            <!-- Wing 1 Control -->
            <div class="wing-control">
                <h3>
                    <span class="wing-label">Wing 1 (Left)</span>
                    <span class="wing-position" id="wing1-display">0%</span>
                </h3>
                <div class="slider-container">
                    <input type="range" min="0" max="100" value="0" class="slider" id="wing1-slider">
                </div>
                <div class="input-group">
                    <input type="number" min="0" max="100" value="0" id="wing1-input" placeholder="Position %">
                    <button onclick="setWing1()">Set</button>
                </div>
                <div class="quick-buttons">
                    <button class="quick-btn" onclick="setWing1Position(0)">0%</button>
                    <button class="quick-btn" onclick="setWing1Position(50)">50%</button>
                    <button class="quick-btn" onclick="setWing1Position(72)">72%</button>
                    <button class="quick-btn" onclick="setWing1Position(100)">100%</button>
                </div>
            </div>

            <!-- Wing 2 Control -->
            <div class="wing-control">
                <h3>
                    <span class="wing-label">Wing 2 (Right)</span>
                    <span class="wing-position" id="wing2-display">0%</span>
                </h3>
                <div class="slider-container">
                    <input type="range" min="0" max="100" value="0" class="slider" id="wing2-slider">
                </div>
                <div class="input-group">
                    <input type="number" min="0" max="100" value="0" id="wing2-input" placeholder="Position %">
                    <button onclick="setWing2()">Set</button>
                </div>
                <div class="quick-buttons">
                    <button class="quick-btn" onclick="setWing2Position(0)">0%</button>
                    <button class="quick-btn" onclick="setWing2Position(50)">50%</button>
                    <button class="quick-btn" onclick="setWing2Position(70)">70%</button>
                    <button class="quick-btn" onclick="setWing2Position(100)">100%</button>
                </div>
            </div>
        </div>

        <div class="gate-viewport">
            <div class="gate-wrapper">
                <svg id="gate-svg" width="3480mm" height="1330mm" viewBox="-7.5 -7.5 3480 1330" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <symbol id="hinge" width="32" height="105">
                            <rect width="32" height="105" fill="#555" />
                            <line x1="0" y1="35" x2="32" y2="35" stroke="#888" stroke-width="1" />
                            <line x1="0" y1="70" x2="32" y2="70" stroke="#888" stroke-width="1" />
                        </symbol>

                        <symbol id="post">
                            <line x1="50" y1="0" x2="50" y2="1330" stroke="#555" stroke-width="100" />
                        </symbol>
                    </defs>

                    <!-- Left side -->
                    <use href="#post" x="0" y="-7.5" />
                    <use href="#hinge" x="105.25" y="10" />
                    <use href="#hinge" x="105.25" y="1100" />

                    <!-- Left wing -->
                    <g id="wing1-group">
                        <!-- Frame horizontal edges -->
                        <line id="wing1-frame-top" y1="7.5" y2="7.5" stroke="#555" stroke-width="15" />
                        <line id="wing1-frame-bottom" y1="1207.5" y2="1207.5" stroke="#555" stroke-width="15" />

                        <!-- Frame vertical edges -->
                        <line id="wing1-frame-left" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />
                        <line id="wing1-frame-right" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />

                        <!-- Horizontal reinforcements -->
                        <line id="wing1-reinf-1" y1="242.5" y2="242.5" stroke="#555" stroke-width="15" />
                        <line id="wing1-reinf-2" y1="1092.5" y2="1092.5" stroke="#555" stroke-width="15" />

                        <!-- 12 vertical round bars (15mm diameter) -->
                        <line id="wing1-bar-1" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />
                        <line id="wing1-bar-2" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />
                        <line id="wing1-bar-3" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />
                        <line id="wing1-bar-4" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />
                        <line id="wing1-bar-5" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />
                        <line id="wing1-bar-6" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />
                        <line id="wing1-bar-7" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />
                        <line id="wing1-bar-8" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />
                        <line id="wing1-bar-9" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />
                        <line id="wing1-bar-10" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />
                        <line id="wing1-bar-11" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />
                        <line id="wing1-bar-12" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />
                    </g>

                    <!-- Right side (mirrored) -->
                    <g transform="translate(3480, 0) scale(-1, 1)">
                        <use href="#post" x="0" y="-7.5" />
                        <use href="#hinge" x="105.25" y="10" />
                        <use href="#hinge" x="105.25" y="1100" />

                        <g id="wing2-group">
                            <line id="wing2-frame-top" y1="7.5" y2="7.5" stroke="#555" stroke-width="15" />
                            <line id="wing2-frame-bottom" y1="1207.5" y2="1207.5" stroke="#555" stroke-width="15" />

                            <line id="wing2-frame-left" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />
                            <line id="wing2-frame-right" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />

                            <line id="wing2-reinf-1" y1="242.5" y2="242.5" stroke="#555" stroke-width="15" />
                            <line id="wing2-reinf-2" y1="1092.5" y2="1092.5" stroke="#555" stroke-width="15" />

                            <line id="wing2-bar-1" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />
                            <line id="wing2-bar-2" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />
                            <line id="wing2-bar-3" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />
                            <line id="wing2-bar-4" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />
                            <line id="wing2-bar-5" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />
                            <line id="wing2-bar-6" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />
                            <line id="wing2-bar-7" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />
                            <line id="wing2-bar-8" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />
                            <line id="wing2-bar-9" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />
                            <line id="wing2-bar-10" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />
                            <line id="wing2-bar-11" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />
                            <line id="wing2-bar-12" y1="7.5" y2="1207.5" stroke="#555" stroke-width="15" />
                        </g>
                    </g>
                </svg>
            </div>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Wing 1 Position</div>
                <div class="stat-value" id="stat-wing1">0%</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Wing 2 Position</div>
                <div class="stat-value" id="stat-wing2">0%</div>
            </div>
        </div>
    </div>

    <script>
        let wing1Position = 0;
        let wing2Position = 0;

        // Corrected geometry based on original SVG:
        //   Wing symbol: rect x=7.5 width=1575 → edges at 7.5 and 1582.5
        //   Wing placed at x=142.5 → absolute edges at 150 and 1725
        //   Rotation axis: x=125 (hinge center)
        const ROTATION_X = 125;

        const FRAME_LEFT_CLOSED = 150;
        const FRAME_RIGHT_CLOSED = 1725;  // CORRECTED from 1710

        const FRAME_LEFT_DX = FRAME_LEFT_CLOSED - ROTATION_X;   // 25mm
        const FRAME_RIGHT_DX = FRAME_RIGHT_CLOSED - ROTATION_X;  // 1600mm

        const FRAME_STROKE_CLOSED = 15;
        const FRAME_STROKE_OPEN = 40;

        // Bar positions (absolute) from original SVG
        const barAbsolute = [271.15, 392.31, 513.46, 634.62, 755.77, 876.92,
                             998.08, 1119.23, 1240.38, 1361.54, 1482.69, 1603.85];
        const barDX = barAbsolute.map(x => x - ROTATION_X);

        function updateWingVisual(wingId, position) {
            const angle = (position / 100) * (Math.PI / 2);
            const cosA = Math.cos(angle);
            const sinA = Math.sin(angle);

            // Frame vertical positions and stroke
            const frameLeftX = ROTATION_X + FRAME_LEFT_DX * cosA;
            const frameRightX = ROTATION_X + FRAME_RIGHT_DX * cosA;
            const vertStroke = FRAME_STROKE_CLOSED * cosA + FRAME_STROKE_OPEN * sinA;
            const halfVS = vertStroke / 2;

            // Frame verticals
            const fl = document.getElementById(`${wingId}-frame-left`);
            fl.setAttribute('x1', frameLeftX);
            fl.setAttribute('x2', frameLeftX);
            fl.setAttribute('stroke-width', vertStroke);

            const fr = document.getElementById(`${wingId}-frame-right`);
            fr.setAttribute('x1', frameRightX);
            fr.setAttribute('x2', frameRightX);
            fr.setAttribute('stroke-width', vertStroke);

            // Frame horizontals
            const hLeft = frameLeftX - halfVS;
            const hRight = frameRightX + halfVS;

            document.getElementById(`${wingId}-frame-top`).setAttribute('x1', hLeft);
            document.getElementById(`${wingId}-frame-top`).setAttribute('x2', hRight);
            document.getElementById(`${wingId}-frame-bottom`).setAttribute('x1', hLeft);
            document.getElementById(`${wingId}-frame-bottom`).setAttribute('x2', hRight);

            // Reinforcements
            document.getElementById(`${wingId}-reinf-1`).setAttribute('x1', frameLeftX);
            document.getElementById(`${wingId}-reinf-1`).setAttribute('x2', frameRightX);
            document.getElementById(`${wingId}-reinf-2`).setAttribute('x1', frameLeftX);
            document.getElementById(`${wingId}-reinf-2`).setAttribute('x2', frameRightX);

            // Bars
            for (let i = 0; i < 12; i++) {
                const barX = ROTATION_X + barDX[i] * cosA;
                const bar = document.getElementById(`${wingId}-bar-${i + 1}`);
                bar.setAttribute('x1', barX);
                bar.setAttribute('x2', barX);
            }
        }

        function updateDisplays(wingId, position) {
            document.getElementById(`${wingId}-display`).textContent = `${position}%`;
            document.getElementById(`${wingId}-slider`).value = position;
            document.getElementById(`${wingId}-input`).value = position;
            document.getElementById(`stat-${wingId}`).textContent = `${position}%`;
        }

        function setWing1Position(pos) {
            wing1Position = Math.max(0, Math.min(100, pos));
            updateWingVisual('wing1', wing1Position);
            updateDisplays('wing1', wing1Position);
        }

        function setWing2Position(pos) {
            wing2Position = Math.max(0, Math.min(100, pos));
            updateWingVisual('wing2', wing2Position);
            updateDisplays('wing2', wing2Position);
        }

        function setWing1() {
            setWing1Position(parseInt(document.getElementById('wing1-input').value) || 0);
        }

        function setWing2() {
            setWing2Position(parseInt(document.getElementById('wing2-input').value) || 0);
        }

        document.getElementById('wing1-slider').addEventListener('input', (e) => {
            setWing1Position(parseInt(e.target.value));
        });

        document.getElementById('wing2-slider').addEventListener('input', (e) => {
            setWing2Position(parseInt(e.target.value));
        });

        document.getElementById('wing1-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') setWing1();
        });

        document.getElementById('wing2-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') setWing2();
        });

        // Initialize at 0%
        setWing1Position(0);
        setWing2Position(0);

        // Demo
        setTimeout(() => {
            setWing1Position(72);
            setWing2Position(70);
        }, 500);
    </script>
</body>
</html>
