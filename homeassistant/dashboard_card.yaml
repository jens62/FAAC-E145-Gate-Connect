# Example Lovelace Dashboard Card for FAAC Gate
# Add this to your Home Assistant dashboard in YAML mode

# Simple card - just the gate control
type: tile
entity: cover.faac_gate
name: FAAC Gate
icon: mdi:gate
features:
  - type: cover-open-close
  - type: cover-position

---

# Advanced card - with detailed status
type: vertical-stack
cards:
  # Main gate control
  - type: tile
    entity: cover.faac_gate
    name: FAAC Gate
    icon: mdi:gate
    features:
      - type: cover-open-close
      - type: cover-position

  # Status details
  - type: entities
    title: Gate Status
    entities:
      - entity: sensor.faac_gate_state
        name: State
        icon: mdi:gate-alert
      - entity: sensor.faac_gate_wing1
        name: Wing 1 Position
        icon: mdi:gate-open
      - entity: sensor.faac_gate_wing2
        name: Wing 2 Position
        icon: mdi:gate-open
      - entity: binary_sensor.faac_gateway_connection
        name: Gateway
        icon: mdi:connection
      - entity: sensor.faac_gate_last_seen
        name: Last Response
        icon: mdi:clock-check

---

# Compact card - glance view
type: glance
title: FAAC Gate
entities:
  - entity: cover.faac_gate
    name: Gate
  - entity: sensor.faac_gate_state
    name: State
  - entity: sensor.faac_gate_wing1
    name: Wing 1
  - entity: sensor.faac_gate_wing2
    name: Wing 2
show_name: true
show_state: true

---

# Picture card with gate image (customize image path)
type: picture-glance
title: FAAC Gate
# Replace with your gate image or use camera feed
image: /local/gate_image.jpg
entities:
  - cover.faac_gate
  - sensor.faac_gate_state
  - binary_sensor.faac_gateway_connection
camera_view: auto

---

# Button card with custom styling
type: custom:button-card
entity: cover.faac_gate
name: FAAC Gate
icon: mdi:gate
show_state: true
show_last_changed: true
styles:
  card:
    - height: 100px
  icon:
    - width: 60px
    - height: 60px
state:
  - value: "open"
    styles:
      card:
        - background-color: "#4caf50"
      icon:
        - color: white
  - value: "closed"
    styles:
      card:
        - background-color: "#f44336"
      icon:
        - color: white
  - value: "opening"
    styles:
      card:
        - background-color: "#66bb6a"
      icon:
        - color: white
  - value: "closing"
    styles:
      card:
        - background-color: "#ef5350"
      icon:
        - color: white
  - value: "stopped"
    styles:
      card:
        - background-color: "#00bcd4"
      icon:
        - color: white
tap_action:
  action: more-info
hold_action:
  action: toggle
double_tap_action:
  action: call-service
  service: cover.stop_cover
  service_data:
    entity_id: cover.faac_gate
